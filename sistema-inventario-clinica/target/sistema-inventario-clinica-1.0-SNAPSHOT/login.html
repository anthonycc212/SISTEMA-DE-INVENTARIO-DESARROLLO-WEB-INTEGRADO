<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Iniciar sesión - Sistema de Inventario Clínica La Luz</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="login-wrap">
    <div class="login-caja">
      <div class="cruz-login">+</div>
      <h1>Clínica La Luz</h1>
      <p class="desc">Sistema de Inventario &mdash; Acceso al sistema</p>
      <form class="formulario" style="box-shadow:none; padding:0;">
        <div class="campo">
          <label for="usuario">Usuario</label>
          <input type="text" id="usuario" placeholder="correo@clinicalaluz.pe">
        </div>
        <div class="campo">
          <label for="clave">Contraseña</label>
          <input type="password" id="clave" placeholder="••••••••">
        </div>
        <button type="submit" class="btn btn-primario">Ingresar</button>
      </form>
    </div>
  </div>
</body>
</html>
